name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check web_harvester main.py test

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term