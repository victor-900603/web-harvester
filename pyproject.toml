[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-harvester"
version = "0.1.0"
description = "設定檔驅動的新聞爬蟲框架：新增一個站點只需要一份 YAML"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor" }]
keywords = ["crawler", "scraper", "news", "yaml", "config-driven"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "colorlog==6.7.0",
    "PyYAML>=5.4.0",
    "jsonschema>=4.0.0",
    "httpx>=0.24.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4==4.14.0",
    "lxml>=6.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[project.scripts]
web-harvester = "web_harvester.cli:main"

[project.urls]
Homepage = "https://github.com/victor-900603/web-harvester"
Issues = "https://github.com/victor-900603/web-harvester/issues"

[tool.setuptools.packages.find]
include = ["web_harvester*"]

[tool.setuptools.package-data]
web_harvester = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["web_harvester"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["web_harvester"]

[tool.mypy]
python_version = "3.11"
files = ["web_harvester", "main.py"]
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
