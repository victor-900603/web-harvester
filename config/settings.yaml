# ============================================================
# Web Harvester Framework - General Configuration
# ============================================================

app:
  name: "news-crawler"
  version: "1.0.0"

engine:
  mode: "sync"                # sync | async
  max_concurrency: 10         # Maximum number of concurrent requests
  request_timeout: 30         # Request timeout in seconds
  download_delay: 1.0         # Delay between requests to the same domain in seconds
  max_retries: 3              # Maximum number of retries for failed requests

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/crawler.log"
  max_bytes: 10485760         # 10MB
  backup_count: 5

# Storage configuration
json_storage:
  enabled: true
  output_dir: "data/json"

database:
  enabled: true
  url: "sqlite:///data/articles.db"
  # PostgreSQL: "postgresql://user:pass@localhost:5432/news_db"
  # MySQL: "mysql+pymysql://user:pass@localhost:3306/news_db"
  echo: false
  pool_size: 5
  max_overflow: 10