# ============================================================
# 聯合新聞網設定
# ============================================================

name: "聯合新聞網"
base_url: "https://udn.com"

request:
  headers:
    Referer: "https://udn.com"

list_page:
  type: "json"

  selectors:
    items: "lists"
    url_field: "titleLink"

  pagination:
    enabled: true
    start: 1

  # 分類名稱對應站內 cate_id（即時新聞頻道）
  categories:
    "要聞": "1"
    "娛樂": "8"
    "社會": "2"
    "地方": "3"
    "國際": "5"
    "兩岸": "4"
    "財經": "6"
    "股市": "11"
    "運動": "7"
    "生活": "9"
    "科技": "13"
    "文教": "12"

  # 未指定 --category 時的預設分類（0 = 全部）
  category_default: "0"

  sources:
    - url: "https://udn.com/api/more?page={page}&id=&channelId=1&cate_id={category}&type=breaknews&totalRecNo=100"
      selectors:
        url_template: "https://udn.com{url}"

    - url: "https://udn.com/api/more?page={page}&id=search:{keyword}&channelId=2&type=searchword"
      selectors:
        url_template: "{url}"

article_page:
  type: "html"

  selectors:
    title:
      type: "text"
      selector: "h1.article-content__title"
      attr: "text"

    content:
      type: "text"
      selector: "section.article-content__editor"
      attr: "text"

    published_at:
      type: "datetime"
      selector: "time.article-content__time"
      attr: "text"
      datetime_format: "%Y-%m-%d %H:%M"

    author:
      type: "text"
      selector: "span.article-content__author"
      attr: "text"
      regex: '(?P<media>.*?)／\s*(?:記者)?(?P<author>.*?)／'

category:
  sources:
    - type: "meta"
      name: "section"

    - type: "meta"
      property: "article:section"

    - type: "json_ld"
      path: "itemListElement.1.name"
  default: "其他"

tags:
  sources:
    - type: "meta"
      name: "news_keywords"
      split: ","
