# ============================================================
# Example Site Configuration
# ============================================================
# Configuration for a news website. This file defines how to crawl and parse the site.
# You can customize the settings according to the structure of the target website.

name: "example"
base_url: "https://example.com"

# Limits for crawling and data collection.
limits:
  max_items: 50
  max_pages: 5
  stop_on_duplicate: false

  timeout: 300

# HTTP request settings, including headers and cookies.
request:
  headers:
    Referer: "https://example.com"
  cookies: {}

# List page configuration: how to find article links and handle pagination.
list_page:
  url: "https://example.com/news?page={page}"
  method: "GET"
  type: "html"                # html | json

  # HTML selectors to extract article links from the list page.
  selectors:
    items: "article.news-item" 
    link: "a"
    link_attr: "href"

  # JSON selectors to extract article links if the list page returns JSON.
  # selectors:
  #   items: "data.articles"
  #   url_field: "url"  
  #   url_template: "https://example.com{url}" 

  # Pagination settings to control how many pages to crawl and where to start.
  pagination:
    enabled: true
    start: 1
    max_pages: 5

  # 分類名稱對應站內值，供 --category 篩選使用（可選）
  # categories:
  #   "財經": "business"
  #   "科技": "tech"
  # category_default: "business"

  # 關鍵字搜尋（可選）：--keyword 指定時覆蓋上述 url/type/selectors/method/pagination
  # search:
  #   url: "https://example.com/search?q={keyword}&page={page}"
  #   type: "html"
  #   selectors:
  #     items: "article.news-item"
  #     link: "a"
  #     link_attr: "href"

article_page:
  type: "html"                # html | json

  # HTML selectors to extract article details from the article page.
  selectors:
    title: "h1.article-title"

    content:
      type: "text"
      selector: "div.article-body"
      attr: "text"

    published_at:
      type: "datetime"
      selector: "time.publish-date"
      attr: "datetime"
      datetime_format: "%Y-%m-%dT%H:%M:%S"

    author:
      type: "text"
      selector: "span.author-name"
      attr: "text"

    url:
      type: "text"
      selector: "link[rel='canonical']"
      attr: "href"

  # JSON selectors to extract article details if the article page returns JSON.
  # selectors:
  #   title: "data.title"
  #   content: "data.content"
  #   published_at: "data.publish_date"
  #   author: "data.author"
  #   url: "data.url"

# Optional article classification. Sources are tried in order; the first one
# yielding a non-empty value wins, otherwise `default` is used.
