# ============================================================
# 範例網站設定 - 最小可用範例
# 完整欄位說明請見 docs/site-config.md
# Schema 定義請見 config/schema/site.schema.json
# ============================================================

name: "example"
base_url: "https://example.com"

# 站點未設定 limits 時，繼承 config/settings.yaml 的全域 limits
# 三層優先權：CLI 參數 > 本檔 limits（選用）> 全域 limits
# 需覆寫時再加入：
# limits:
#   max_items: 50
#   max_pages: 5
#   stop_on_duplicate: false
#   timeout: 300

# 站點請求設定（僅套用於本站）
request:
  headers:
    Referer: "https://example.com"

# 列表頁設定
list_page:
  type: "html"

  # 擷取文章連結的抽取設定
  extract:
    item_selector: "article.news-item"
    link_selector: "a"
    link_attr: "href"

  # 分頁設定（頁數上限由 limits.max_pages 控制）
  pagination:
    enabled: true
    start: 1

  # 列表來源（至少一個，URL 可含 {page}/{keyword}/{category} 佔位符）
  sources:
    - url: "https://example.com/news?page={page}"

# 文章頁設定
article_page:
  type: "html"

  fields:
    title: "h1.article-title"

    content:
      as: "text"
      selector: "div.article-body"
      attr: "text"

    published_at:
      as: "datetime"
      selector: "time.publish-date"
      attr: "datetime"
      datetime_format: "%Y-%m-%dT%H:%M:%S"

    author:
      as: "text"
      selector: "span.author-name"
      attr: "text"
