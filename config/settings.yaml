# ============================================================
# Web Harvester Framework - 全域設定
# ============================================================

app:
  name: "news-crawler"
  version: "1.0.0"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/crawler.log"
  max_bytes: 10485760         # 10MB
  backup_count: 5
