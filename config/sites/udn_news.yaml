# ============================================================
# 聯合新聞網設定
# ============================================================

name: "聯合新聞網"
base_url: "https://udn.com"

limits:
  max_items: 30
  max_pages: 3
  stop_on_duplicate: true
  timeout: 180

request:
  headers:
    Referer: "https://udn.com"

list_page:
  url: "https://udn.com/api/more?page={page}&id=&channelId=1&cate_id=0&type=breaknews&totalRecNo=100"
  method: "GET"
  type: "json"

  selectors:
    items: "lists"
    url_field: "titleLink"
    url_template: "https://udn.com{url}"

  pagination:
    enabled: true
    start: 1
    max_pages: 1

article_page:
  type: "html"

  selectors:
    title:
      selector: "h1.article-content__title"
      attr: "text"

    content:
      selector: "section.article-content__editor"
      attr: "text"

    date:
      selector: "time.article-content__time"
      attr: "datetime"

    author:
      selector: "span.article-content__author"
      attr: "text"

    category:
      selector: "a.breadcrumb-items"
      attr: "text"
